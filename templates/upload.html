<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Proyecto</title>
    <link rel="stylesheet" href="static/css/upload.css">
    <link rel="icon" href="static\img\Logo.ico">
</head>
<body>

    <header>
        <h1>Leyendas Sobre Ruedas</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="/mythcar">Catálogo</a>
            <a href="/proyectos">Proyectos</a>
            <a href="/bot">Asistencia Virtual</a>
        </nav>
    </header>

    <div class="center">
        <h1>Subir Proyecto</h1>

        {% if errors %}
        <ul class="form-errors" role="alert">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form action="{{ url_for('projects.upload') }}" enctype="multipart/form-data" method="POST">
            <!-- Campo para la imagen -->
            <div class="file-upload-container">
                <label for="pic" class="file-upload-label">Seleccionar archivo</label>
                <input type="file" name="pic" id="pic" class="file-upload-input" accept="{{ accept }}" required />
            </div>

            <!-- Campos adicionales -->
            <label for="project_name">Nombre del Proyecto:</label>
            <input type="text" id="project_name" name="project_name" placeholder="Ej: McLaren MP4/4" maxlength="100" value="{{ form.get('project_name', '') }}" required />

            <label for="motor">Motor:</label>
            <input type="text" id="motor" name="motor" placeholder="Ej: V6 Biturbo 4.5L" maxlength="100" value="{{ form.get('motor', '') }}" required />

            <label for="power">Potencia:</label>
            <input type="text" id="power" name="power" placeholder="Ej: 450 hp, 510 Nm" maxlength="100" value="{{ form.get('power', '') }}" required />

            <label for="acceleration">0-100Km/h:</label>
            <input type="text" id="acceleration" name="acceleration" placeholder="Ej: 2.4 segundos" maxlength="100" value="{{ form.get('acceleration', '') }}" required />

            <label for="top_speed">Velocidad Máxima:</label>
            <input type="text" id="top_speed" name="top_speed" placeholder="Ej: 321 km/h" maxlength="100" value="{{ form.get('top_speed', '') }}" required />

            <!-- Botón para subir el proyecto -->
            <input type="submit" value="Subir Proyecto" />
        </form>

        <!-- Botón para volver a proyectos -->
        <div class="highlight">
            <a href="{{ url_for('projects.proyectos') }}">Volver a Proyectos</a>
        </div>
    </div>

</body>
</html>
