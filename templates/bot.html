<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot del Carro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bot.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/Logo.ico') }}">
</head>
<body>
    <header>
        <h1>Leyendas Sobre Ruedas</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="/mythcar">Catálogo</a>
            <a href="/proyectos">Proyectos</a>
            <a href="/bot">Asistencia Virtual</a>
        </nav>
    </header>
    <div class="container">
        <h1>Asistente Virtual</h1>
        <div id="chat-box">
            <div id="messages"></div>  <!-- mensajes -->
        </div>

        <input type="text" id="user-message" placeholder="Escribe tu mensaje...">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        function agregarMensaje(texto, clase) {
            const div = document.createElement('div');
            div.classList.add(clase);
            div.textContent = texto;
            document.getElementById('messages').appendChild(div);

            // Desplazar la vista hacia abajo para ver el nuevo mensaje
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function enviarMensaje() {
            const input = document.getElementById('user-message');
            const mensajeUsuario = input.value.trim();
            if (mensajeUsuario === '') return;

            agregarMensaje(mensajeUsuario, 'user-message');
            input.value = '';

            // Enviar mensaje al backend
            fetch("{{ url_for('enviar_mensaje') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: mensajeUsuario })
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                agregarMensaje(ok ? data.response : (data.error || 'Ocurrió un error.'), 'bot-message');
            })
            .catch(() => {
                agregarMensaje('No se pudo contactar al asistente. Intenta de nuevo.', 'bot-message');
            });
        }

        document.getElementById('user-message').addEventListener('keydown', function (evento) {
            if (evento.key === 'Enter') {
                enviarMensaje();
            }
        });
    </script>
</body>
</html>
